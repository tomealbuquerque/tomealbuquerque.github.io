name: Refresh Scholar and deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Refresh Google Scholar data
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/sync_scholar.py
      - name: Upload public website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
